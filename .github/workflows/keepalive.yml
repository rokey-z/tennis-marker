# Optional: keeps a free-tier Supabase project from pausing (it pauses after ~7 days without requests).
# Needs the VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets. Note: GitHub disables scheduled
# workflows after 60 days without repo activity — re-enable it under Actions if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */2 * *' # every 2 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.KEEPALIVE_ENABLED == 'true' }}
    steps:
      - name: Ping REST endpoint
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase secrets not set — skipping"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          # 200 (empty list under RLS) or 401/406 both count as activity; fail only on network errors
          [ "$code" != "000" ]
